[build-system]
build-backend = "uv_build"
requires = [
  "uv_build>=0.12.0,<0.13"
]

[dependency-groups]
dev = [
  "black>=24.4.2,<27.0.0",
  "bump-my-version>=1.5.0,<1.6.0",
  "deptry>=0.23.0,<0.26.0",
  "gitpython>=3.1.58,<4.0.0",
  "mutmut>=3.3.0,<4.0.0",
  "mypy>=2.3.0,<3.0",
  "pre-commit>=4.6.1,<5.0.0",
  "pylint>=4.0.6,<5.0.0",
  "ruff>=0.16.0,<0.17.0",
  "tomli-w>=1.0.0,<2.0.0",
  "tomli>=2.0.1,<3.0.0",
  "towncrier>=23.11,<26.0",
  "tox>=4.58.0,<5.0.0",
  "twine>=6.0.0,<7.0.0",
  "validate-pyproject[all,store]>=0.25,<0.26",
  "vulture>=2.11,<3.0.0"
]
docs = [
  "docutils>=0.18,<0.22",
  "furo>=2024.4.27,<2026.0.0",
  "matplotlib<3.11",
  "myst-parser>=3.0.1,<5.0.0",
  "pytest==9.1.1",
  "pyyaml>=6.0.1,<7.0.0",
  "roman-numerals==4.1.0",
  "sphinx-copybutton>=0.5.2,<0.6.0",
  "sphinx-markdown-builder>=0.5.5,<0.7.0",
  "sphinx-sitemap>=2.9.0,<3.0.0",
  "sphinx>=7,<8.2",
  "sphinxext-opengraph>=0.13.0,<0.14.0"
]
flake8 = [
  "flake8>=7.1.0,<8.0.0"
]
plugin = [
  "shiv>=1.0.8,<2.0.0"
]
tests = [
  "hypothesis>=6.100,<7.0.0",
  "hypothesmith>=0.3.3,<0.4.0",
  "pytest-benchmark>=4,<6",
  "pytest-codspeed>=4.0.0,<5.0.0",
  "pytest-cov>=5,<8",
  "pytest-randomly>=3.15,<5.0",
  "pytest-sugar>=1.0.0,<2.0.0",
  "pytest-xdist>=3.6.1,<4.0.0",
  "pytest>=9.1.1,<10.0"
]

[project]
authors = [
  {email = "s.whitlock@live.com", name = "jshwi"}
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14"
]
dependencies = [
  "astroid (>=4.0.2,<5.0.0)",
  "pathspec (>=0.12.1,<1.2.0)",
  "tomli (>=2.0.1,<3.0.0)",
  "wcmatch (>=10.2.1,<11.0.0)"
]
description = "Check signature params for proper documentation"
keywords = [
  "check",
  "docs",
  "docstring",
  "params",
  "signature"
]
license = "MIT"
license-files = [
  "LICENSE",
  "licenses/*"
]
maintainers = [
  {email = "s.whitlock@live.com", name = "jshwi"}
]
name = "docsig"
readme = "README.rst"
requires-python = ">=3.10"
version = "0.94.0"

[project.entry-points."flake8.extension"]
SIG = "docsig.plugin:Flake8"

[project.entry-points."validate_pyproject.tool_schema"]
docsig = "docsig.plugin:ValidatePyproject"

[project.scripts]
docsig = "docsig.__main__:main"

[project.urls]
Documentation = "https://docsig.io/en/latest"
Homepage = "https://docsig.io"
Repository = "https://github.com/jshwi/docsig"

[tool.black]
line-length = 79
target-version = ["py310"]

[tool.bumpversion]
allow_dirty = true
commit = true
commit_args = "-sS"
current_version = "0.94.0"
message = "bump: version {current_version} → {new_version}"
sign_tags = true
tag = true

[[tool.bumpversion.files]]
filename = "docs/conf.py"

[[tool.bumpversion.files]]
filename = "docsig/_version.py"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
replace = 'version = "{new_version}"'
search = 'version = "{current_version}"'

[[tool.bumpversion.files]]
filename = "README.rst"
replace = "rev: v{new_version}"
search = "rev: v{current_version}"

[[tool.bumpversion.files]]
filename = "README.rst"
replace = "docsig: {new_version}"
search = "docsig: {current_version}"

[[tool.bumpversion.files]]
filename = "README.rst"
replace = "- docsig=={new_version}"
search = "- docsig=={current_version}"

[[tool.bumpversion.files]]
filename = "SECURITY.md"

[tool.codespell]
ignore-words-list = "astroid,atLeast"

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover"
]
fail_under = 100

[tool.coverage.run]
branch = true
omit = [
  "*/sitecustomize.py",
  "docs/conf.py",
  "docsig/__main__.py",
  "docsig/_vendor/sphinx/ext/napoleon.py",
  "tests/plugins/_gitignore.py",
  "whitelist.py"
]

[tool.deptry.per_rule_ignores]
DEP004 = [
  "docutils",
  "flake8",
  "git",
  "pytest",
  "sphinx",
  "tomli_w",
  "yaml"
]

[tool.docsig]
check-class = true
check-protected-class-methods = true

[tool.mutmut]
# the help block in README.rst is asserted against the parser, and the
# mutants/ tree only receives the source and the tests otherwise
also_copy = [
  "README.rst"
]
do_not_mutate = [
  "docsig/_vendor/*",
  "docsig/_version.py"
]
# mutants/ is gitignored, so the _gitignore plugin would collect
# nothing there; randomly is off so cached mutant results stay
# comparable between runs; the attached -pname form is required, as
# toml-sort sorts array values so a separate flag would come unpaired
pytest_add_cli_args = [
  "-pno:_gitignore",
  "-pno:randomly"
]
pytest_add_cli_args_test_selection = [
  "tests/"
]
source_paths = [
  "docsig/"
]

[tool.mypy]
exclude = [
  'whitelist\.py'
]
ignore_missing_imports = true
install_types = true
non_interactive = true

[tool.pylint.options]
disable = [
  "consider-using-f-string",
  "fixme"
]
ignore-patterns = [
  'conf\.py',
  'whitelist\.py'
]
min-similarity-lines = 9

[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--cov-report=term-missing",
  "--durations=5",
  "-p _gitignore",
  "-vv"
]
filterwarnings = "ignore::DeprecationWarning"
markers = [
  "benchmark: Marks tests as benchmarks"
]
norecursedirs = [
  ".git",
  ".idea",
  ".mypy_cache",
  ".pytest_cache",
  "docs"
]
pythonpath = [
  "tests/plugins"
]

[tool.ruff]
# vendored code is upstream's to format, and whitelist.py is generated
extend-exclude = [
  "docsig/_vendor",
  "whitelist.py"
]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
ignore = [
  # both sites it finds are the last arm of a chain of guard clauses,
  # and collapsing only that arm breaks the shape of the rest
  "SIM103"
]
select = [
  "B", # flake8-bugbear
  "COM812", # add-trailing-comma
  "E", # pycodestyle errors, via flake8
  "F", # pyflakes, via flake8; F541 was rm_unneeded_f_str
  "FLY", # flynt, less --transform-concats, which ruff has no rule for
  "I", # isort
  # bandit ran as `-lll`, so only the checks it rates high severity
  "S102", # exec
  "S103", # world-writable file permissions
  "S304", # insecure cipher
  "S312", # telnetlib
  "S321", # ftplib
  "S324", # insecure hash function
  "S501", # request without certificate validation
  "S502", # ssl with bad version
  "S505", # weak cryptographic key
  "S507", # ssh without host key verification
  "S509", # snmp with weak cryptography
  "S602", # subprocess with shell=True
  "S605", # process started with a shell
  "S609", # wildcard injection
  "S612", # insecure logging.config.listen
  "S701", # jinja2 without autoescape
  "SIM", # flake8-simplify
  "UP", # pyupgrade; UP031/UP032 were also flynt's
  "W" # pycodestyle warnings, via flake8
]

[tool.ruff.lint.per-file-ignores]
"docsig/_scope.py" = ["E701"]
"tests/exclude_test.py" = ["E501"]
"tests/fix_test.py" = ["E501"]

[tool.towncrier]
directory = "changelog"
filename = "CHANGELOG.md"
issue_format = "[#{issue}](https://github.com/jshwi/docsig/issues/{issue})"
package = "docsig"
start_string = "<!-- release notes start -->\n"
template = "changelog/_template.md"

[tool.towncrier.fragment.add]
name = "Added"

[tool.towncrier.fragment.change]
name = "Changed"

[tool.towncrier.fragment.deprecate]
name = "Deprecated"

[tool.towncrier.fragment.feat]
name = "Feature"

[tool.towncrier.fragment.fix]
name = "Fixed"

[tool.towncrier.fragment.hack]
name = "Hacked"

[tool.towncrier.fragment.remove]
name = "Removed"

[tool.towncrier.fragment.security]
name = "Security"

[tool.uv.build-backend]
# docsig is a flat layout; the backend otherwise looks for src/docsig
module-root = ""

[tool.vulture]
exclude = [
  "_vendor",
  "tests/base_test.py",
  "tests/conftest.py",
  "tests/plugin"
]
make_whitelist = true
paths = [
  "docsig",
  "tests"
]
