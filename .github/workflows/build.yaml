---
name: Build
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  PYTHONIOENCODING: utf-8
  UV: uv

jobs:
  build:
    name: "${{ matrix.os }}-python${{ matrix.python-version }}"
    runs-on: "${{ matrix.os }}"
    env:
      UV_PYTHON: "${{ matrix.python-version }}"
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout Build
        id: checkout-build
        uses: actions/checkout@v7
      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Get uv Version
        id: get-uv-version
        run: echo "version=$(cat .uv-version)" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Setup uv
        id: setup-uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "${{ steps.get-uv-version.outputs.version }}"
          enable-cache: true
      - name: Build
        id: build
        run: make build
      - name: Check Dependencies
        id: check-dependencies
        run: make check-deps
      - name: Test Scripts
        id: test-scripts
        run: |
          make test-scripts
      - name: Upload Coverage
        id: upload-coverage
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}"
