---
name: Build
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  PYTHONIOENCODING: utf-8
  UV: uv

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.10"
    steps:
      - name: Checkout Build
        id: checkout-build
        uses: actions/checkout@v7
      - name: Get uv Version
        id: get-uv-version
        run: echo "version=$(cat .uv-version)" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Setup uv
        id: setup-uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "${{ steps.get-uv-version.outputs.version }}"
          enable-cache: true
      - name: Build
        id: build
        run: make build
      - name: Check Dependencies
        id: check-dependencies
        run: make check-deps

  build:
    name: "${{ matrix.os }}-python${{ matrix.python-version }}"
    runs-on: "${{ matrix.os }}"
    env:
      UV_PYTHON: "${{ matrix.python-version }}"
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout Build
        id: checkout-build
        uses: actions/checkout@v7
      - name: Get uv Version
        id: get-uv-version
        run: echo "version=$(cat .uv-version)" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Setup uv
        id: setup-uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "${{ steps.get-uv-version.outputs.version }}"
          enable-cache: true
      - name: Test
        id: test
        run: make tests
      - name: Upload Coverage
        id: upload-coverage
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}"
