---
version: 2
build:
  os: ubuntu-22.04
  tools:
    python: "3.10"
  jobs:
    post_create_environment:
      - python -m pip install uv==$(cat .uv-version)
    post_install:
      - >-
        UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH
        uv sync --no-default-groups --group docs

sphinx:
  configuration: docs/conf.py
